publish_to: 'none'
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.0.3
  flutter_svg: ^2.2.1
  silver_wolf_engine: ^0.1.0

dev_dependencies:
